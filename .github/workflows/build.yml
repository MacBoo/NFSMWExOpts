name: Online Build (Extra Options)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: DirectX SDK installieren (Name korrigiert)
      run: |
        choco install directx-sdk -y

    - name: MSBuild vorbereiten
      uses: microsoft/setup-msbuild@v2

    - name: NuGet-Pakete wiederherstellen
      run: |
        $slnPath = Get-ChildItem -Recurse -Filter "*.sln" | Select-Object -First 1 -ExpandProperty FullName
        Write-Host "Gefundene Projektdatei: $slnPath"
        nuget restore "$slnPath"
        echo "SLN_PATH=$slnPath" >> $env:GITHUB_ENV

    - name: Projekt kompilieren (32-Bit)
      run: |
        msbuild "${{ env.SLN_PATH }}" /p:Configuration=Release /p:Platform=x86 /p:DXSDK_DIR="C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)\"

    - name: Fertige Dateien speichern
      uses: actions/upload-artifact@v4
      with:
        name: NFSMW-ExtraOptions-Release
        path: |
          **/Release/*.dll
          **/Release/*.asi
