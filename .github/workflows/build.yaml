name: Online Build (Extra Options)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: DirectX SDK installieren
      run: |
        choco install directx-sdk -y

    - name: MSBuild vorbereiten
      uses: microsoft/setup-msbuild@v2

    - name: NuGet-Pakete wiederherstellen
      working-directory: ./NFSMWExtraOptions
      run: |
        nuget restore NFSMWExtraOptions.sln

    - name: Projekt kompilieren (32-Bit)
      working-directory: ./NFSMWExtraOptions
      run: |
        msbuild NFSMWExtraOptions.sln /p:Configuration=Release /p:Platform=Win32 /p:DXSDK_DIR="C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)\"

    - name: Fertige Dateien speichern
      uses: actions/upload-artifact@v4
      with:
        name: NFSMW-ExtraOptions-Release
        path: D:/a/NFSMWExOpts/NFSMWExOpts/NFSMWExtraOptions/Release/NFSMWExtraOptions/scripts/NFSMWExtraOptions.asi    

